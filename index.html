<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b1017;
            --card-bg: #141b24;
            --card-hover: #1b2430;
            --accent-color: #3ee0b2;
            --text-main: #e7eef7;
            --text-muted: #8b9bb0;
            --border-color: #2a3544;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .brand { font-size: 18px; font-weight: 700; color: var(--text-main); }
        .brand span { color: var(--accent-color); }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
        .search-input { width: 100%; padding: 12px 16px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); font-size: 14px; outline: none; }
        .search-input:focus { border-color: var(--accent-color); }
        .filter-tags { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .tag { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .tag.active { background: var(--accent-color); color: #04251b; font-weight: 600; border-color: var(--accent-color); }
        .shops-list { display: flex; flex-direction: column; gap: 10px; }
        .shop-row { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-decoration: none; color: var(--text-main); transition: border-color 0.2s; }
        .shop-row:hover { border-color: var(--accent-color); background: var(--card-hover); }
        .shop-meta h4 { font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .shop-meta p { font-size: 13px; color: var(--text-muted); }
        .badge { font-size: 10px; padding: 2px 6px; background: rgba(62, 224, 178, 0.1); color: var(--accent-color); border-radius: 4px; border: 1px solid rgba(62, 224, 178, 0.3); }
        .btn-open { font-size: 13px; font-weight: 600; color: var(--accent-color); white-space: nowrap; }
        .state { text-align: center; color: var(--text-muted); padding: 20px; }
        .state.error { color: #f87171; }
    </style>
</head>
<body>

    <header>
        <div class="brand">🔗 STORE <span>HUB</span></div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск по каталогу...">
        <div class="filter-tags" id="categoryTags"></div>
    </div>

    <div class="shops-list" id="shopsBox">
        <p class="state">Загрузка каталога...</p>
    </div>

    <script>
        // Публичный HTTPS-адрес бэкенда (временный ngrok-туннель; при перезапуске адрес меняется).
        const API_URL = "https://blinker-harmonize-factor.ngrok-free.dev";

        const searchInput = document.getElementById("searchInput");
        const categoryBox = document.getElementById("categoryTags");
        const itemsBox = document.getElementById("shopsBox");

        let currentCategory = "";
        let searchTimer = null;
        let requestId = 0;

        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) tg.expand();

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, ch => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[ch]));
        }

        function safeUrl(value) {
            try {
                const url = new URL(value);
                return url.protocol === "https:" || url.protocol === "http:" ? url.href : "#";
            } catch {
                return "#";
            }
        }

        async function api(path, params = {}) {
            const query = new URLSearchParams(
                Object.entries(params).filter(([, v]) => v !== "" && v != null)
            ).toString();
            const res = await fetch(`${API_URL}${path}${query ? "?" + query : ""}`, {
                headers: { "ngrok-skip-browser-warning": "1" },
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        function renderCategories(categories) {
            const tags = [{ slug: "", name: "Все" }, ...categories];
            categoryBox.innerHTML = tags.map(c => `
                <div class="tag${c.slug === currentCategory ? " active" : ""}" data-slug="${escapeHtml(c.slug)}">${escapeHtml(c.name)}</div>
            `).join("");
        }

        async function loadCategories() {
            try {
                renderCategories(await api("/api/public/categories"));
            } catch (e) {
                console.error("Не удалось загрузить категории", e);
                renderCategories([]);
            }
        }

        async function loadItems() {
            const current = ++requestId;
            try {
                const data = await api("/api/public/items", {
                    q: searchInput.value.trim(),
                    category: currentCategory,
                });
                if (current !== requestId) return;

                const items = data.items || [];
                if (items.length === 0) {
                    itemsBox.innerHTML = `<p class="state">Ничего не найдено</p>`;
                    return;
                }

                itemsBox.innerHTML = items.map(item => `
                    <a href="${escapeHtml(safeUrl(item.url))}" class="shop-row" target="_blank" rel="noopener noreferrer">
                        <div class="shop-meta">
                            <h4>${escapeHtml(item.title)} <span class="badge">${escapeHtml(item.category.name)}</span></h4>
                            <p>${escapeHtml(item.description)}</p>
                        </div>
                        <span class="btn-open">Открыть ↗</span>
                    </a>
                `).join("");
            } catch (e) {
                if (current !== requestId) return;
                console.error("Не удалось загрузить записи", e);
                itemsBox.innerHTML = `<p class="state error">Ошибка загрузки данных</p>`;
            }
        }

        categoryBox.addEventListener("click", event => {
            const tag = event.target.closest(".tag");
            if (!tag) return;
            currentCategory = tag.dataset.slug;
            categoryBox.querySelectorAll(".tag").forEach(t => t.classList.toggle("active", t === tag));
            loadItems();
        });

        searchInput.addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(loadItems, 250);
        });

        loadCategories();
        loadItems();
    </script>
</body>
</html>
